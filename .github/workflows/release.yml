name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the plugin version
        run: |
          version=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME 和 plugin.json 的版本 $version 不符"; exit 1; }
      - name: Build the skill zip for claude.ai upload
        run: |
          mkdir -p dist
          cd skills
          zip -r ../dist/zh-tw-prose.zip zh-tw-prose -x '*/__pycache__/*'
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/zh-tw-prose.zip \
            --title "$GITHUB_REF_NAME" --notes "見 CHANGELOG.md。claude.ai 使用者下載 zh-tw-prose.zip，在「設定 → 功能 → Skills」上傳。"
